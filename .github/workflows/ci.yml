name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders. src/lib/env.ts reads these lazily at request time, so the build
      # shouldn't need them; they're here so CI never depends on real secrets.
      CLIENT_ID: "0"
      CLIENT_SECRET: ci-placeholder
      BOT_TOKEN: ci-placeholder
      SESSION_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build
